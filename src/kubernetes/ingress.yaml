apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cinemaabyss-ingress
  namespace: cinemaabyss
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
    - host: cinemaabyss.example.com
      http:
        paths:
          # Основной прокси для всех API запросов
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: proxy-service
                port:
                  number: 8000

          # Прямой доступ к events-service для тестирования
          - path: /api/events
            pathType: Prefix
            backend:
              service:
                name: events-service
                port:
                  number: 8082

          # Health checks для всех сервисов
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: proxy-service
                port:
                  number: 8000

          - path: /api/events/health
            pathType: Exact
            backend:
              service:
                name: events-service
                port:
                  number: 8082

          - path: /api/movies/health
            pathType: Exact
            backend:
              service:
                name: movies-service
                port:
                  number: 8081

          # Fallback на proxy-service для всех остальных запросов
          - path: /
            pathType: Prefix
            backend:
              service:
                name: proxy-service
                port:
                  number: 8000